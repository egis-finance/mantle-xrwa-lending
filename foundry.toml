[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "paris"
remappings = ["@solmate/=lib/solmate/src/"]

# Lint configuration: exclude code-size suggestions and specific lints we intentionally ignore
[profile.default.lint]
# Only include severities we care about; omit "code-size" to silence code size suggestions
severity = ["high", "med", "low", "info", "gas"]
# Exclude rules for intentional deviations from strict Solidity style guide:
# - unwrapped-modifier-logic: Original exclusion
# - screaming-snake-case-const: Allow ERC20 standard constants (name, symbol, decimals) to remain lowercase for compatibility
# - mixed-case-function: Allow capitalized acronyms in function names (setDVN, supplyUSDC) per industry practice
# - asm-keccak256: Prefer readable high-level keccak256 over assembly optimization for maintainability
exclude_lints = ["unwrapped-modifier-logic", "screaming-snake-case-const", "mixed-case-function", "asm-keccak256"]

# Fuzz testing configuration
[profile.default.fuzz]
runs = 256
max_test_rejects = 65536

# RPC endpoints
[rpc_endpoints]
mantle_vte = "${MANTLE_RPC_VTE}"
ethereum_vte = "${ETHEREUM_RPC_VTE}"

# Etherscan verification
[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }

[etherscan.mantle]
key = "${MANTLE_API_KEY}"
url = "https://explorer.mantle.xyz/api"
