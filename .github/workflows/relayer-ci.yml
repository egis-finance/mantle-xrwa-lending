name: Relayer CI

on:
  push:
    branches: [main, develop]
    paths: ['relayer/**']
  pull_request:
    branches: [main, develop]
    paths: ['relayer/**']

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./relayer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go build -v ./...
      - run: go test -v -race ./pkg/...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
          working-directory: relayer
