global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'xrwa-relayer'

scrape_configs:
  - job_name: 'relayer'
    static_configs:
      - targets: ['relayer:8080']
        labels:
          service: 'xrwa-dvn-relayer'
          environment: 'development'
    metrics_path: '/metrics'
    scrape_interval: 10s
